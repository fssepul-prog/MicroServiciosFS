# ── AUTH SERVICE (puerto 8081) ────────────────────────────────
server.port=8081
spring.application.name=ms-auth

# Base de datos EXCLUSIVA de este microservicio
spring.datasource.url=jdbc:mysql://localhost:3306/db_auth?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate crea/actualiza tablas automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Registro en Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# JWT - MISMA CLAVE que en api-gateway
jwt.secret=foodmarket-super-secret-key-2024-spring-boot-dsy1103
jwt.expiration=86400000

management.endpoints.web.exposure.include=health,info
