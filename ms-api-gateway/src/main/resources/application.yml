server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # Rutas publicas (sin JWT)
        - id: auth-service
          uri: lb://ms-auth
          predicates:
            - Path=/auth/**

        # Rutas protegidas (JWT validado por JwtAuthFilter)
        - id: user-service
          uri: lb://ms-user
          predicates:
            - Path=/users/**

        - id: restaurant-service
          uri: lb://ms-restaurant
          predicates:
            - Path=/restaurants/**

        - id: order-service
          uri: lb://ms-order
          predicates:
            - Path=/orders/**

        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/payments/**

        - id: delivery-service
          uri: lb://delivery-service
          predicates:
            - Path=/deliveries/**

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/notifications/**

        - id: review-service
          uri: lb://review-service
          predicates:
            - Path=/reviews/**

        - id: search-service
          uri: lb://search-service
          predicates:
            - Path=/search/**

        - id: report-service
          uri: lb://report-service
          predicates:
            - Path=/reports/**

# Clave JWT - IDENTICA a la del auth-service
jwt:
  secret: foodmarket-super-secret-key-2024-spring-boot-dsy1103

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
